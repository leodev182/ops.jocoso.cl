<div class="tags-page">
  <h2>Tags</h2>

  <div class="tags-page__form">
    <input
      class="tags-page__input"
      type="text"
      placeholder="Nombre del tag..."
      [(ngModel)]="newName"
      (keydown.enter)="onCreateTag()"
    />
    <div class="tags-page__color-wrap">
      <label class="tags-page__color-label">Color</label>
      <input type="color" [(ngModel)]="newColor" class="tags-page__color" />
    </div>
    <button class="btn-primary" [disabled]="!newName.trim() || isCreating" (click)="onCreateTag()">
      {{ isCreating ? 'Creando...' : '+ Crear tag' }}
    </button>
  </div>

  @if (createError) {
    <p class="error-msg">{{ createError }}</p>
  }
  @if (errorMessage) {
    <p class="error-msg">{{ errorMessage }}</p>
  }

  @if (isLoading) {
    <p class="tags-page__loading">Cargando...</p>
  }

  @if (!isLoading && tags.length === 0 && !errorMessage) {
    <p class="tags-page__empty">Sin tags creados todavía.</p>
  }

  <div class="tags-page__list">
    @for (tag of tags; track tag.id) {
      <div class="tag-row">
        <span class="tag-chip" [style.background]="tag.color ?? '#e0e7ff'">
          {{ tag.name }}
        </span>
        <span class="tag-slug">{{ tag.slug }}</span>
        <button class="icon-btn icon-btn--danger" title="Eliminar" (click)="onDeleteTag(tag)">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
    }
  </div>
</div>
