<div class="products-list-page">
  <div class="products-list-page__header">
    <h2>Productos</h2>
    <button class="btn-primary" (click)="onCreateProduct()">+ Nuevo producto</button>
  </div>

  <div class="products-list-page__filters">
    @for (opt of statusOptions; track opt.label) {
      <button
        class="filter-btn"
        [class.active]="selectedStatus === opt.value"
        (click)="onStatusChange(opt.value)"
      >
        {{ opt.label }}
      </button>
    }
  </div>

  @if (loadError) {
    <p class="error-msg">{{ loadError }}</p>
  }

  <div class="products-list-page__table">
    <app-product-table
      [products]="products"
      (productClick)="onProductClick($event)"
      (statusChange)="onProductStatusChange($event)"
    ></app-product-table>
  </div>

  @if (totalPages > 1) {
    <div class="products-list-page__pagination">
      <button
        class="page-btn"
        [disabled]="currentPage === 1"
        (click)="goToPage(currentPage - 1)"
      >← Anterior</button>

      <span class="page-info">{{ currentPage }} / {{ totalPages }}</span>

      <button
        class="page-btn"
        [disabled]="currentPage === totalPages"
        (click)="goToPage(currentPage + 1)"
      >Siguiente →</button>
    </div>
  }
</div>
