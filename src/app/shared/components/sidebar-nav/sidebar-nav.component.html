<aside class="sidebar" [class.sidebar--collapsed]="collapsed">
  <div class="sidebar__header">
    @if (!collapsed) {
      <span class="sidebar__brand">ops.jocoso.cl</span>
    }
    <button class="sidebar__toggle" (click)="toggleCollapse.emit()" [title]="collapsed ? 'Expandir' : 'Colapsar'">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        @if (collapsed) {
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        } @else {
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        }
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav">
    <ul>
      @for (item of navItems; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" class="sidebar__link" [title]="collapsed ? item.label : ''">
            <span class="sidebar__icon" [innerHTML]="safeIcon(item.icon)"></span>
            @if (!collapsed) {
              <span class="sidebar__label">{{ item.label }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>

  <button class="sidebar__logout" (click)="logoutClick.emit()" [title]="collapsed ? 'Cerrar sesión' : ''">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    @if (!collapsed) {
      <span>Cerrar sesión</span>
    }
  </button>
</aside>
